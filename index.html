<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diego Adrian Ramirez Salazar — Robotics & Control Engineer</title>
<meta name="description" content="Robotics & Electronics Engineer — control systems, industrial automation and AI. Ingeniero en Robótica y Electrónica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf6; --ink:#141414; --ink-2:#4a4a4a; --ink-3:#8a8a86; --rule:#d9d6cc;
  --accent:#c8102e; --accent-soft:rgba(200,16,46,.08); --hi:#fff3c4;
  --serif:"Newsreader",Charter,"Iowan Old Style",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --maxw:1120px;
}
[data-theme="dark"]{
  --paper:#111214; --ink:#ecebe6; --ink-2:#b4b3ad; --ink-3:#7c7b76; --rule:#2c2d31;
  --accent:#ff6b3d; --accent-soft:rgba(255,107,61,.10); --hi:rgba(255,107,61,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.brand{font-family:var(--mono);font-size:.8rem;letter-spacing:.06em}
.brand b{color:var(--accent);font-weight:500}
.nav{display:flex;gap:22px;font-size:.88rem}
.nav a{text-decoration:none;color:var(--ink-2)}
.nav a:hover{color:var(--accent)}
.toggles{display:flex;gap:6px}
.tg{font-family:var(--mono);font-size:.74rem;border:1px solid var(--rule);padding:5px 9px;border-radius:2px;letter-spacing:.05em}
.tg:hover{border-color:var(--ink)}
.tg span.on{color:var(--accent);font-weight:500}
@media (max-width:820px){.nav{display:none}}
.tg{white-space:nowrap}
@media (max-width:520px){.brand span{display:none}.top .wrap{padding:0 14px;gap:8px}.toggles{gap:4px;min-width:0}.tg,.navcta{padding:5px 7px}}
@media (max-width:400px){.brand{display:none}.top .wrap{justify-content:flex-end}}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;padding:72px 0 40px;align-items:center}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}
/* name block — formal: tracked small caps + uppercase surname, dimension-line rule */
h1.name{margin:0 0 22px;font-family:var(--serif);font-weight:500;line-height:1}
h1.name .n1{display:block;font-size:clamp(1.05rem,1.9vw,1.4rem);font-variant:small-caps;letter-spacing:.32em;color:var(--ink-2);margin:0 0 10px 2px}
h1.name .n2{display:block;font-size:clamp(2.5rem,11vw,4.7rem);text-transform:uppercase;letter-spacing:.015em;line-height:.98}
h1.name .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
h1.name .w>span{display:inline-block;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
h1.name .n1 .w>span{animation-delay:.05s}h1.name .n2 .w:nth-child(1)>span{animation-delay:.18s}h1.name .n2 .w:nth-child(2)>span{animation-delay:.3s}
@keyframes rise{to{transform:none}}
.namerule{display:block;position:relative;height:14px;margin:18px 0 0;max-width:520px}
.namerule i{position:absolute;left:0;right:0;top:6px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:left;animation:draw 1.1s .55s cubic-bezier(.2,.7,.2,1) forwards}
.namerule::before,.namerule::after{content:"";position:absolute;top:0;width:1.5px;height:14px;background:var(--accent)}
.namerule::before{left:0}.namerule::after{right:0;opacity:0;animation:fade .3s 1.5s forwards}
.namerule span{position:absolute;right:0;top:-16px;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;color:var(--ink-3);opacity:0;animation:fade .4s 1.5s forwards}
@keyframes draw{to{transform:scaleX(1)}}@keyframes fade{to{opacity:1}}
.role{font-family:var(--serif);font-size:1.35rem;margin:0 0 6px}
.tagline{color:var(--ink-2);margin:0 0 28px;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid var(--ink);font-size:.9rem;text-decoration:none;border-radius:2px;transition:.15s}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{border-color:var(--accent)}
.meta{margin-top:22px;display:flex;flex-wrap:wrap;gap:18px}
.toast{font-family:var(--mono);font-size:.75rem;color:var(--accent);min-height:1em}

.drawing{position:relative;border:1px solid var(--rule);aspect-ratio:1/0.92;background:
  linear-gradient(var(--rule) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/24px 24px;background-color:var(--paper)}
.drawing::before{content:"";position:absolute;inset:0;background:var(--paper);opacity:.82;pointer-events:none}
.drawing svg{position:absolute;inset:0;width:100%;height:100%}
.drawing .corner{position:absolute;font-family:var(--mono);font-size:.66rem;color:var(--ink-3);letter-spacing:.06em;z-index:2}
.drawing .tl{top:8px;left:10px}.drawing .br{bottom:8px;right:10px}.drawing .bl{bottom:8px;left:10px}
.arm-link{stroke:var(--ink);stroke-width:1.4;fill:none}
.arm-fill{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.arm-joint{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.arm-center{stroke:var(--accent);stroke-width:1}
.centerline{stroke:var(--ink-3);stroke-width:.8;stroke-dasharray:10 3 2 3}
.leader{stroke:var(--accent);stroke-width:.9;fill:none}
.callout{font-family:var(--mono);font-size:10.5px;fill:var(--ink);letter-spacing:.04em}
.callout-sub{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.target{stroke:var(--accent);stroke-width:1;fill:none}
.dim{stroke:var(--ink-3);stroke-width:.8}
.dimtxt{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:44px}.simwrap{max-width:560px}}
/* multi-simulation frame */
.simwrap{min-width:0}
.simwrap .drawing{margin:0}
.simtabs{display:flex;border:1px solid var(--rule);border-bottom:0;font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;overflow-x:auto;scrollbar-width:none}
.simtabs::-webkit-scrollbar{display:none}
.simtab{flex:1 0 auto;padding:8px 12px;border-left:1px solid var(--rule);color:var(--ink-3);text-transform:uppercase;white-space:nowrap;text-align:left;transition:color .15s,background .15s}
.simtab:first-child{border-left:0}
.simtab b{color:var(--accent);font-weight:500;margin-right:6px}
.simtab:hover{color:var(--ink)}
.simtab[aria-selected="true"]{color:var(--ink);background:var(--paper);box-shadow:inset 0 -2px 0 var(--accent)}
.simpanel{position:absolute;inset:0;z-index:1}
.simpanel[hidden]{display:none!important}
.simbtn{position:absolute;top:6px;right:8px;z-index:3;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);background:var(--paper);padding:3px 7px;border-radius:2px;color:var(--ink-2)}
.simbtn:hover{border-color:var(--accent);color:var(--accent)}
.simcap{margin:8px 0 0;font-family:var(--mono);font-size:.68rem;letter-spacing:.03em;color:var(--ink-3);min-height:2.4em}
.simcap b{color:var(--accent);font-weight:500}
.drawing canvas{display:block}
/* MNIST */
.mn{position:absolute;inset:30px 12px 28px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:center}
.mn-padbox{position:relative;aspect-ratio:1;width:100%;max-height:100%;border:1px solid var(--ink);background:var(--paper)}
.mn-pad{width:100%;height:100%;touch-action:none;cursor:crosshair}
.mn-ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--ink-3);pointer-events:none;text-transform:uppercase}
.mn-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.mn-top{display:flex;align-items:center;gap:10px}
.mn-prev{width:56px;height:56px;image-rendering:pixelated;border:1px solid var(--rule);background:#000;flex:none}
.mn-dig{font-family:var(--serif);font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;color:var(--accent)}
.mn-conf{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);letter-spacing:.04em;min-height:1em}
.mn-bars{display:grid;gap:2px}
.mn-bar{display:grid;grid-template-columns:10px minmax(0,1fr) 34px;gap:6px;align-items:center;font-family:var(--mono);font-size:.6rem;color:var(--ink-2)}
.mn-bar div{height:6px;background:var(--rule)}
.mn-bar i{display:block;height:100%;width:0;background:var(--ink-3);transition:width .15s}
.mn-bar.top i{background:var(--accent)}
.mn-bar b{font-weight:400;text-align:right}
.tmr-ctl{cursor:pointer}
.tmr-ctl:hover rect.box{stroke:var(--accent)}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.plinks button{font:inherit;color:var(--accent);border-bottom:1px solid var(--accent);padding:0}
/* FIG.03 classifier comparison */
.cl{position:absolute;inset:30px 12px 28px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
.cl-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;min-height:0}
.cl-pad{width:100%;aspect-ratio:1;max-height:100%;border:1px solid var(--ink);touch-action:none;cursor:crosshair;background:var(--paper);justify-self:start}
.cl-pipe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;gap:6px 8px;align-content:start}
.cl-step{font-family:var(--mono);font-size:.58rem;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
.cl-step canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#000;border:1px solid var(--rule);margin-top:3px}
.cl-res{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink)}
.cl-card{padding:7px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.cl-card+.cl-card{border-left:1px solid var(--rule)}
.cl-card .k{grid-column:1/-1;font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.cl-card .d{font-family:var(--serif);font-size:2rem;line-height:1.1;color:var(--accent)}
.cl-card .c{font-family:var(--mono);font-size:.6rem;color:var(--ink-2)}
.cl-card .s{grid-column:1/-1;font-family:var(--mono);font-size:.56rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-card.mine{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cl-card.mine .k{color:var(--ink)}
.cl-card .k em{font-style:normal;background:var(--accent);color:#fff;padding:1px 5px;border-radius:2px;margin-right:2px;letter-spacing:.08em}
.cl-card .d{font-size:1.25rem;font-family:var(--serif);white-space:nowrap}
.cl-top{grid-template-columns:auto minmax(0,1fr)}
.cl-padbox{justify-self:start;align-self:start;width:var(--pz,160px);height:var(--pz,160px);aspect-ratio:auto;max-height:none}
.cl-step canvas.vec{image-rendering:auto}
.cl-step span,.cl-card .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cl-step,.cl-card{min-width:0}
@media (max-width:560px){.cl-card{grid-template-columns:1fr}.cl-card .d{font-size:1.05rem!important}.cl-card .c{font-size:.55rem}}
@media (max-width:560px){.cl{inset:26px 8px 30px;gap:6px}.cl-top{gap:8px}.cl-card{padding:4px 8px}.cl-card .d{font-size:1.4rem}.cl-step{font-size:.48rem}.cl-pipe{gap:2px 6px}.cl-step canvas{margin-top:1px;width:min(100%,64px)}.cl-card .k{font-size:.5rem}}
@media (max-width:560px){
  .drawing .br{display:none}.simbtn{top:auto;bottom:5px}
  .drawing .corner{font-size:.58rem}
  .mn{inset:26px 8px 26px;gap:8px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .mn-prev{width:38px;height:38px}.mn-dig{font-size:2rem}
  .mn-bars{grid-template-columns:1fr 1fr;gap:2px 8px}
  .mn-bar{grid-template-columns:8px minmax(0,1fr);font-size:.55rem;gap:4px}.mn-bar b{display:none}
  .simtab{padding:7px 9px;font-size:.64rem}
}

/* section header w/ dimension line */
section{padding:56px 0}
.sh{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end;margin-bottom:34px}
.sh .num{font-family:var(--mono);color:var(--accent);font-size:.82rem}
.sh h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,3.2vw,2.5rem);margin:0;line-height:1.1;letter-spacing:-.01em}
.dimline{grid-column:1/-1;position:relative;height:16px}
.dimline .ln{position:absolute;left:0;right:0;top:8px;height:1px;background:var(--ink-3);transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.dimline::before,.dimline::after{content:"";position:absolute;top:2px;width:1px;height:13px;background:var(--ink-3)}
.dimline::before{left:0}.dimline::after{right:0;opacity:0;transition:opacity .3s 1s}
.dimline .lbl{position:absolute;right:0;top:-14px;font-family:var(--mono);font-size:.68rem;color:var(--ink-3);letter-spacing:.06em;opacity:0;transition:opacity .4s .9s}
.in .dimline .ln{transform:scaleX(1)}.in .dimline::after,.in .dimline .lbl{opacity:1}

/* layout with margin notes */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:48px}
.side{font-size:.84rem;color:var(--ink-2)}
.note{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin-bottom:18px}
.note b{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--ink);font-weight:500;margin-bottom:2px}
@media (max-width:900px){.cols{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 24px}}
.lead p{font-family:var(--serif);font-size:1.28rem;line-height:1.55;margin:0 0 18px;max-width:36em}
.lead p:first-child::first-letter{font-size:3.4em;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--accent);font-weight:500}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.stat{padding:22px 20px 24px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat .v{font-family:var(--serif);font-size:3rem;line-height:1;letter-spacing:-.02em;font-weight:500}
.stat .v small{font-size:.45em;color:var(--accent);margin-left:2px}
.stat .k{margin-top:12px;font-size:.88rem;color:var(--ink-2)}
.stat .src{margin-top:8px}

/* experience */
.job{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding:26px 0;border-top:1px solid var(--rule)}
.job:first-child{border-top:1px solid var(--ink)}
.when{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);line-height:1.5}
.when .where{color:var(--ink-3);display:block;margin-top:6px;text-transform:none;letter-spacing:0}
.job h3{font-family:var(--serif);font-weight:500;font-size:1.45rem;margin:0 0 2px;line-height:1.2}
.job .org{color:var(--ink-2);font-size:.92rem;margin-bottom:12px}
.job ul{margin:0;padding:0;list-style:none}
.job li{position:relative;padding:5px 8px 5px 22px;margin-left:-8px;border-radius:2px;transition:background .2s,opacity .2s}
.job li::before{content:"";position:absolute;left:8px;top:15px;width:7px;height:1px;background:var(--accent)}
.job li strong{font-weight:600}
.sub{margin-top:18px;padding-left:16px;border-left:1px dashed var(--rule)}
.sub h4{font-family:var(--sans);font-weight:600;font-size:1rem;margin:0}
.sub .org{margin-bottom:6px}
body.filtering .job li{opacity:.32}
body.filtering .job li.match{opacity:1;background:var(--hi)}
@media (max-width:700px){.job{grid-template-columns:1fr;gap:8px}}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.proj{padding:22px 22px 26px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);transition:background .2s,opacity .2s}
.proj .pn{font-family:var(--mono);font-size:.72rem;color:var(--accent);letter-spacing:.06em}
.proj h3{font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.2;margin:10px 0 4px}
.proj .ctx{font-size:.84rem;color:var(--ink-3);margin-bottom:12px}
.plinks{display:flex;gap:16px;margin-top:14px;font-family:var(--mono);font-size:.76rem;letter-spacing:.03em}
.plinks a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}
.proj p{margin:0 0 14px;font-size:.94rem;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.7rem;padding:3px 7px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2);letter-spacing:.02em}
body.filtering .proj{opacity:.32}
body.filtering .proj.match{opacity:1;background:var(--hi)}

/* skills */
.skillhelp{margin:-18px 0 22px;font-size:.88rem;color:var(--ink-2)}
.sgroup{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:14px 0;border-top:1px solid var(--rule)}
.sgroup:first-of-type{border-top:1px solid var(--ink)}
.sgroup h4{margin:3px 0 0;font-size:.9rem;font-weight:600}
.sk{font-family:var(--mono);font-size:.76rem;padding:5px 9px;border:1px solid var(--rule);border-radius:2px;margin:0 6px 6px 0;color:var(--ink);transition:.15s}
.sk[data-has="1"]:hover{border-color:var(--accent)}
.sk[data-has="1"]::after{content:" ↗";color:var(--accent);font-size:.9em}
.sk.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sk.active::after{color:#fff}
.sk[data-has="0"]{cursor:default}
.clear{font-family:var(--mono);font-size:.74rem;color:var(--accent);margin-left:6px;visibility:hidden}
body.filtering .clear{visibility:visible}
@media (max-width:700px){.sgroup{grid-template-columns:1fr;gap:6px}}

/* education */
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px}
.edu h3{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:6px 0 4px}
.edu p{margin:0;color:var(--ink-2);font-size:.94rem}
.edu ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:.94rem}

/* contact */
.contact{border:1px solid var(--ink);padding:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px;align-items:center}
.contact h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,3.4vw,2.6rem);margin:0 0 8px;line-height:1.1}
.contact p{margin:0;color:var(--ink-2)}
@media (max-width:800px){.contact{grid-template-columns:minmax(0,1fr);padding:24px 14px}}
.contact>*{min-width:0}
.ccard,.ccard *{min-width:0}.ccard{max-width:100%}.chead span{overflow-wrap:anywhere}

/* contact card — styled as a drawing parts list (hero) / sheet (contact) */
.ccard{position:relative;margin-top:28px;max-width:540px;border:1px solid var(--ink);background:var(--paper)}
.ccard::before,.ccard::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.ccard::before{top:-6px;left:-6px;border-top:1.5px solid var(--accent);border-left:1.5px solid var(--accent)}
.ccard::after{bottom:-6px;right:-6px;border-bottom:1.5px solid var(--accent);border-right:1.5px solid var(--accent)}
.chead{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-bottom:1px solid var(--ink);font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  background:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px)}
.chead span{background:var(--paper);padding:1px 6px}
.chead .live{display:inline-flex;align-items:center;gap:6px}
.chead .live i{width:6px;height:6px;border-radius:50%;background:#2fa36b;box-shadow:0 0 0 3px rgba(47,163,107,.18)}
.crow{position:relative;display:grid;grid-template-columns:28px 22px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--rule);transition:background .2s}
.chead+.crow{border-top:0}
.crow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform:scaleY(0);transition:transform .25s}
.crow:hover{background:var(--accent-soft)}
.crow:hover::before{transform:scaleY(1)}
.cref{font-family:var(--mono);font-size:.68rem;color:var(--accent);letter-spacing:.04em}
.cico{width:22px;height:22px;stroke:var(--ink);stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cbody{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ck{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:3px}
.cv{font-family:var(--serif);font-size:1.12rem;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;width:fit-content}
a.cv{background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 1px no-repeat;transition:background-size .3s,color .2s}
a.cv:hover{color:var(--accent);background-size:100% 1px}
.cact{display:flex;gap:6px;align-items:center}
.cp,.cgo{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2);transition:.15s;text-decoration:none}
.cp svg,.cgo svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cp:hover,.cgo:hover{border-color:var(--accent);color:var(--accent)}
.cp.ok{border-color:var(--accent);background:var(--accent);color:#fff}
.cgo svg{transition:transform .2s}.crow:hover .cgo svg{transform:translateX(2px)}
.cfoot{display:flex;justify-content:space-between;padding:6px 14px;border-top:1px solid var(--ink);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}

/* big variant in contact section: 2x2 sheet */
.contact .ccard{margin-top:0;max-width:none;width:100%}
.ccard.big .rows{display:grid;grid-template-columns:1fr 1fr}
.ccard.big .crow{grid-template-columns:1fr auto;grid-template-areas:"ref ico" "body body" "act act";align-items:start;padding:18px 18px 16px;border-top:0;border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);gap:8px}
.ccard.big .crow:nth-child(odd){border-left:0}
.ccard.big .crow:nth-last-child(-n+2){border-bottom:0}
.ccard.big .cref{grid-area:ref}.ccard.big .cico{grid-area:ico;width:26px;height:26px}
.ccard.big .cbody{grid-area:body;margin-top:10px}.ccard.big .cact{grid-area:act;margin-top:6px}
.ccard.big .cv{font-size:1.3rem}
.navcta{font-family:var(--mono);font-size:.74rem;padding:6px 10px;background:var(--accent);color:#fff!important;text-decoration:none;border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.navcta:hover{filter:brightness(1.1)}
@media (max-width:560px){.crow{grid-template-columns:22px minmax(0,1fr) auto;gap:12px}.crow .cref{display:none}
  .cgo{display:none}.cv,.ccard.big .cv{font-size:1rem!important}.chead{font-size:.6rem;flex-wrap:wrap;gap:4px 8px}
  .ccard.big .rows{display:block}
  .ccard.big .crow{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:none;align-items:center;padding:12px 14px;gap:12px;border-left:0;border-bottom:0;border-top:1px solid var(--rule)}
  .ccard.big .crow:first-child{border-top:0}
  .ccard.big .cico,.ccard.big .cbody,.ccard.big .cact{grid-area:auto;margin:0}.ccard.big .cico{width:22px;height:22px}.ccard.big .cv{font-size:1.12rem}}

/* title block footer */
footer{padding:40px 0 48px}
.tblock{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 1fr;border:1.5px solid var(--ink);font-family:var(--mono);font-size:.72rem}
.tblock>div{padding:8px 10px;border-left:1px solid var(--ink)}
.tblock>div:first-child{border-left:0}
.tblock .h{display:block;color:var(--ink-3);font-size:.62rem;letter-spacing:.08em;margin-bottom:3px}
.tblock .ok{color:var(--accent)}
@media (max-width:760px){.tblock{grid-template-columns:1fr 1fr}.tblock>div{border-left:0;border-top:1px solid var(--ink)}.tblock>div:first-child{grid-column:1/-1;border-top:0}}
.fine{margin-top:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}h1.name .w>span{transform:none}.namerule i{transform:none}.namerule::after,.namerule span{opacity:1}}

/* print = clean CV */
@media print{
  .top,.drawing,.cta,.toggles,.skillhelp,.clear,.cp,.contact>div:first-child,.dimline,.side,footer .fine{display:none!important}
  .contact{border:0;padding:0;display:block}
  .ccard{border:0;margin-top:4pt}.ccard::before,.ccard::after,.chead,.cfoot,.cref,.cico,.cact{display:none!important}.crow{padding:1pt 0;border:0;grid-template-columns:1fr}.ck{display:inline;margin-right:6pt}.cbody{flex-direction:row}
  body{background:#fff;color:#000;font-size:10.5pt}
  .hero{grid-template-columns:1fr;padding:0 0 8pt}
  h1.name .n2{font-size:24pt}h1.name .n1{font-size:12pt;margin:0}.namerule{display:none}h1.name .w>span{transform:none!important}
  section{padding:10pt 0;break-inside:avoid-page}
  .cols{grid-template-columns:1fr}
  .stat .v{font-size:18pt}
  body.filtering .job li,body.filtering .proj{opacity:1;background:none}
}

function observeDims(){
  if(!("IntersectionObserver" in window)){ document.querySelectorAll("section").forEach(s=>s.classList.add("in")); return; }
  const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);} }),{threshold:.2});
  document.querySelectorAll("section:not(.in)").forEach(s=>io.observe(s));
}

      const p=fk(), e=p[3], j=p[i];
      const a1=Math.atan2(e.y-j.y,e.x-j.x), a2=Math.atan2(goal.y-j.y,goal.x-j.x);
      let d=a2-a1; d=Math.atan2(Math.sin(d),Math.cos(d));
      th[i]=Math.max(lim[i][0],Math.min(lim[i][1],th[i]+d*0.5));
    }
  }
  function linkPoly(a,b,w){ const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L*w,ny=dx/L*w;
    return `${a.x+nx},${a.y+ny} ${b.x+nx},${b.y+ny} ${b.x-nx},${b.y-ny} ${a.x-nx},${a.y-ny}`; }
  function draw(){
    const p=fk(), w=[9,7.5,6];
    for(let i=0;i<3;i++){ links[i].setAttribute("points",linkPoly(p[i],p[i+1],w[i]));
      axis[i].setAttribute("x1",p[i].x);axis[i].setAttribute("y1",p[i].y);axis[i].setAttribute("x2",p[i+1].x);axis[i].setAttribute("y2",p[i+1].y);
      joints[i].setAttribute("transform",`translate(${p[i].x},${p[i].y})`); }
    const e=p[3], a=e.a, c=Math.cos(a), s=Math.sin(a), ox=-s*10, oy=c*10;
    grip.setAttribute("d",`M${e.x+ox},${e.y+oy} l${c*16},${s*16} M${e.x-ox},${e.y-oy} l${c*16},${s*16} M${e.x+ox},${e.y+oy} L${e.x-ox},${e.y-oy}`);
    tgt.setAttribute("transform",`translate(${target.x},${target.y})`);
    const anchors=[{x:226,y:396},{x:p[1].x,y:p[1].y},{x:(p[2].x+p[3].x)/2,y:(p[2].y+p[3].y)/2},{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}];
    callouts.forEach((co,i)=>{ const an=anchors[i], ex=co.lx<200?co.lx+96:co.lx-6, ey=co.ly-4;
      co.l.setAttribute("points",`${an.x},${an.y} ${ex},${ey} ${co.lx<200?co.lx+100:co.lx-4},${ey}`);
      co.dot.setAttribute("cx",an.x);co.dot.setAttribute("cy",an.y); });
  }
  function toSvg(ev){ const r=svg.getBoundingClientRect(); return {x:(ev.clientX-r.left)/r.width*520,y:(ev.clientY-r.top)/r.height*480}; }
  svg.parentElement.addEventListener("pointermove",ev=>{pointer=toSvg(ev);});
  svg.parentElement.addEventListener("pointerleave",()=>{pointer=null;});
  function clampGoal(g){ const dx=g.x-base.x, dy=Math.min(g.y,400)-base.y, R=Math.hypot(dx,dy), M=Ls[0]+Ls[1]+Ls[2]-4;
    return R>M?{x:base.x+dx/R*M,y:base.y+dy/R*M}:{x:g.x,y:base.y+dy}; }
  function tick(now){
    if(window.SIM && SIM.active!=="arm"){ requestAnimationFrame(tick); return; }
    const t=(now-t0)/1000;
    const goal = pointer || {x:300+90*Math.sin(t*0.45),y:230+70*Math.sin(t*0.7+1)};
    const g=clampGoal(goal); target.x+= (g.x-target.x)*0.12; target.y+=(g.y-target.y)*0.12;
    ccd(target); draw(); requestAnimationFrame(tick);
  }
  ccd(target); draw();
  if(!reduce) requestAnimationFrame(tick);
  else svg.parentElement.addEventListener("pointermove",()=>{ if(pointer){ target=clampGoal(pointer); ccd(target); draw(); } });
})();

(function slam(){
  const cv=$("#slamCv"), c=cv.getContext("2d"), CS=10, GW=52, GH=48;
  const world=new Uint8Array(GW*GH); // 1 = wall
  const wall=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&y>=0&&x<GW&&y<GH)world[y*GW+x]=1;};
  wall(3,4,48,4); wall(3,43,48,43); wall(3,4,3,43); wall(48,4,48,43);          // outer walls
  wall(4,20,14,20); wall(20,20,30,20); wall(30,5,30,15);                       // rooms
  wall(36,20,47,20); wall(22,28,22,42); wall(30,30,40,30); wall(40,30,40,36);
  wall(10,30,14,34); wall(36,10,40,13);                                        // obstacles

  const occ=(x,y)=>{const gx=(x/CS)|0,gy=(y/CS)|0;return gx<0||gy<0||gx>=GW||gy>=GH||world[gy*GW+gx]===1;};
  const hit=(x,y,r)=>occ(x-r,y-r)||occ(x+r,y-r)||occ(x-r,y+r)||occ(x+r,y+r);
  function reset(){ known=new Uint8Array(GW*GH); bot={x:90,y:110,a:0}; goal=null; auto=true; trail=[]; wp=1; }
  function scan(){ const rays=[]; for(let k=0;k<60;k++){ const a=bot.a+k*Math.PI*2/60; let d=0, hx=bot.x, hy=bot.y, h=false;
      while(d<130){ d+=3; hx=bot.x+Math.cos(a)*d; hy=bot.y+Math.sin(a)*d; const gx=(hx/CS)|0,gy=(hy/CS)|0; if(gx<0||gy<0||gx>=GW||gy>=GH)break;
        if(world[gy*GW+gx]){ known[gy*GW+gx]=2; h=true; break; } if(known[gy*GW+gx]!==2) known[gy*GW+gx]=1; }
      rays.push([hx,hy,h]); } return rays; }

  reset(); requestAnimationFrame(tick);

})();

    // 2 hull and 3 DP vertices drawn over a faint copy
    const acc=css("--accent");
    for(const [k,poly,dots] of [[1,F.H,false],[2,F.V,true]]){ const c=S[k], q=112/280; c.fillStyle="#000"; c.fillRect(0,0,112,112); c.globalAlpha=.35; c.drawImage(ink,0,0,112,112); c.globalAlpha=1;
      c.strokeStyle=acc; c.lineWidth=2; c.beginPath(); poly.forEach((p,i)=>i?c.lineTo(p[0]*q,p[1]*q):c.moveTo(p[0]*q,p[1]*q)); c.closePath(); c.stroke();
      if(dots){ c.fillStyle="#fff"; poly.forEach(p=>{ c.beginPath(); c.arc(p[0]*q,p[1]*q,3.5,0,7); c.fill(); }); } }
    // 4 14x14 network input (crop to bbox, fit 12x12, centered)
    const d=ic.getImageData(0,0,280,280).data; let x0=280,y0=280,x1=-1,y1=-1;
    for(let y=0;y<280;y++)for(let x=0;x<280;x++) if(d[(y*280+x)*4]>25){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    const bw=x1-x0+1,bh=y1-y0+1,sc=12/Math.max(bw,bh),nw=Math.max(1,Math.round(bw*sc)),nh=Math.max(1,Math.round(bh*sc));
    const t=S[3]; t.fillStyle="#000"; t.fillRect(0,0,14,14); t.imageSmoothingQuality="high"; t.drawImage(ink,x0,y0,bw,bh,Math.floor((14-nw)/2),Math.floor((14-nh)/2),nw,nh);
    const td=t.getImageData(0,0,14,14).data, x=new Float32Array(196); for(let i=0;i<196;i++) x[i]=td[i*4]/255;
    // classical: standardized features -> logistic regression
    const fz=F.f.map((v,i)=>(v-M.mu[i])/M.sd[i]), pml=softmax(M.lrW.map((w,k)=>w.reduce((a,wi,i)=>a+wi*fz[i],M.lrb[k])));
    // MLP: 196 -> 32 (ReLU) -> 4 (softmax)
    const hdn=M.b1.map((b,j)=>{ let s=b; for(let i=0;i<196;i++) s+=x[i]*M.W1[i][j]; return s>0?s:0; });
    const pdl=softmax(M.b2.map((b,k)=>{ let s=b; for(let j=0;j<hdn.length;j++) s+=hdn[j]*M.W2[j][k]; return s; }));
    const bm=pml.indexOf(Math.max(...pml)), bd=pdl.indexOf(Math.max(...pdl)), cf=lang==="es"?"confianza ":"confidence ";
    $("#clDml").textContent=ICON[bm]+" "+NAMES[lang][bm]; $("#clCml").textContent=cf+(pml[bm]*100).toFixed(0)+"%";
    $("#clDdl").textContent=ICON[bd]+" "+NAMES[lang][bd]; $("#clCdl").textContent=cf+(pdl[bd]*100).toFixed(0)+"%";
  }
  new MutationObserver(()=>{ ctx.clearRect(0,0,280,280); for(const st of strokes) for(let i=1;i<st.length;i++){ ctx.lineWidth=18;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=css("--ink");ctx.beginPath();ctx.moveTo(...st[i-1]);ctx.lineTo(...st[i]);ctx.stroke(); } if(dirty) run(); })
    .observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  // keep the pad square: side = min(row height, 58% of row width)
  const top=document.querySelector(".cl-top"), fit=()=>{ const r=top.getBoundingClientRect(); if(r.width) top.style.setProperty("--pz",Math.floor(Math.min(r.height,r.width*0.58))+"px"); };
  new ResizeObserver(fit).observe(top);
  SIM.hooks.clf={ show:fit, reset:clear, lang(){ document.querySelectorAll("[data-cl]").forEach(el=>el.textContent=L[el.dataset.cl][lang]); $("#clPh").textContent=lang==="es"?"✎ dibuja ○ △ □ ☆":"✎ draw ○ △ □ ☆"; if(dirty) run(); } };
  clear();
})();

SIM.chrome();

render();
</script>
